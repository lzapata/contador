<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goat Conut AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f1a0f; --surface: #162116; --card: #1d2e1d; --border: #2a3f2a; --green: #4ade80; --text: #e2f5e2; --muted: #6b8f6b; --mono: 'Space Mono', monospace; --sans: 'Syne', sans-serif; }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #setup-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; z-index: 100; }
        .setup-field { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; }
        .setup-field input, .setup-field select { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--mono); padding: 12px; outline: none; }
        #btn-start { width: 100%; max-width: 380px; background: var(--green); color: #0f1a0f; font-weight: 800; border: none; border-radius: 12px; padding: 14px; cursor: pointer; font-size: 1rem; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
        #status-pill { padding: 5px 12px; border-radius: 20px; font-family: var(--mono); font-size: 0.7rem; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
        #video-wrap { position: relative; background: #000; width: 100%; }
        #cam { width: 100%; height: auto; display: block; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #big-count { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); border: 1.5px solid var(--green); border-radius: 8px; padding: 8px 15px; text-align: center; }
        #big-count .num { font-size: 2.5rem; color: var(--green); font-family: var(--mono); font-weight: bold; line-height: 1; }
        #controls { background: var(--surface); padding: 15px; display: flex; align-items: center; gap: 15px; border-top: 1px solid var(--border); }
        .bump { animation: bump 0.2s ease-in-out; }
        @keyframes bump { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="setup-screen">
    <div style="font-size: 4rem;">🐐</div>
    <h1 style="margin: 0;">Goat Conut AI</h1>
    <div class="setup-field">
        <label style="font-size: 0.7rem; color: var(--muted);">ROBOFLOW API KEY</label>
        <input type="password" id="api-key-input" placeholder="rf_xxxxxxxxxxxxxxx">
    </div>
    <div class="setup-field">
        <label style="font-size: 0.7rem; color: var(--muted);">MODELO</label>
        <select id="model-select">
            <option value="brookside-research/goat-looker/1">Goat Looker ⭐</option>
            <option value="justin-burger/goats-hqnax/1">Goats HQ</option>
        </select>
    </div>
    <button id="btn-start" onclick="startApp()">🚀 INICIAR DETECTOR</button>
</div>

<header>
    <div style="font-weight: 800;">GOAT CONUT AI</div>
    <div id="status-pill">ESPERANDO...</div>
</header>

<main style="flex: 1; display: flex; flex-direction: column;">
    <div id="video-wrap">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="big-count">
            <div class="num" id="counter">0</div>
            <div style="font-size: 0.6rem; color: var(--muted);">CABRAS</div>
        </div>
    </div>
    <div id="controls">
        <div style="flex: 1;">
            <div style="font-size: 0.7rem; margin-bottom: 5px;">CONFIANZA: <span id="conf-val">0.40</span></div>
            <input type="range" id="conf-range" min="0.1" max="0.9" step="0.05" value="0.40" style="width: 100%;">
        </div>
        <button onclick="location.reload()" style="background: transparent; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 8px;">🔄</button>
    </div>
</main>

<script>
let apiKey = '';
let modelEndpoint = '';
let confidenceThreshold = 0.40;
let videoEl, canvasEl, ctx;
let countHistory = [];
let prevCount = 0;
let running = false;

// 1. INICIO
async function startApp() {
    console.log("Iniciando...");
    apiKey = document.getElementById('api-key-input').value.trim();
    modelEndpoint = document.getElementById('model-select').value;

    if (!apiKey.startsWith('rf_')) {
        alert("La API Key debe empezar con 'rf_'. Verifica que no tenga espacios.");
        return;
    }

    document.getElementById('setup-screen').style.display = 'none';
    initCamera();
}

// 2. CÁMARA
async function initCamera() {
    videoEl = document.getElementById('cam');
    canvasEl = document.getElementById('overlay');
    ctx = canvasEl.getContext('2d');

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }
        });
        videoEl.srcObject = stream;
        videoEl.onloadedmetadata = () => {
            canvasEl.width = videoEl.videoWidth;
            canvasEl.height = videoEl.videoHeight;
            running = true;
            document.getElementById('status-pill').textContent = '🐐 ACTIVO';
            document.getElementById('status-pill').style.borderColor = '#4ade80';
            requestAnimationFrame(loop);
        };
    } catch (e) {
        alert("Error al acceder a la cámara. Por favor, asegúrate de dar permisos: " + e.message);
    }
}

// 3. LOOP
let lastInference = 0;
function loop(t) {
    if (!running) return;
    if (t - lastInference > 600) { 
        lastInference = t;
        runInference();
    }
    requestAnimationFrame(loop);
}

// 4. API ROBOFLOW
async function runInference() {
    if (!videoEl.videoWidth) return;

    const tmpCanvas = document.createElement('canvas');
    tmpCanvas.width = videoEl.videoWidth;
    tmpCanvas.height = videoEl.videoHeight;
    tmpCanvas.getContext('2d').drawImage(videoEl, 0, 0);
    
    const base64 = tmpCanvas.toDataURL('image/jpeg', 0.5).split(',')[1];
    const url = `https://detect.roboflow.com/${modelEndpoint}?api_key=${apiKey}&confidence=${confidenceThreshold * 100}`;

    try {
        const resp = await fetch(url, {
            method: 'POST',
            body: base64,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });

        if (resp.ok) {
            const data = await resp.json();
            renderDetections(data.predictions || []);
        }
    } catch (e) {
        console.error("Error en API:", e);
    }
}

// 5. DIBUJO Y CONTEO
function renderDetections(predictions) {
    ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    
    predictions.forEach(p => {
        const w = p.width;
        const h = p.height;
        const x = p.x - (w / 2);
        const y = p.y - (h / 2);

        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, w, h);
        
        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 16px Space Mono';
        ctx.fillText(`CABRA ${Math.round(p.confidence*100)}%`, x, y > 20 ? y - 10 : y + 20);
    });

    // Suavizado
    countHistory.push(predictions.length);
    if (countHistory.length > 10) countHistory.shift();
    const currentCount = Math.round(countHistory.reduce((a,b) => a+b, 0) / countHistory.length);

    const numEl = document.getElementById('counter');
    numEl.textContent = currentCount;
    
    if (currentCount !== prevCount) {
        numEl.classList.add('bump');
        setTimeout(() => numEl.classList.remove('bump'), 200);
        prevCount = currentCount;
    }
}

// EVENTOS
document.getElementById('conf-range').addEventListener('input', function() {
    confidenceThreshold = parseFloat(this.value);
    document.getElementById('conf-val').textContent = confidenceThreshold.toFixed(2);
});
</script>

</body>
</html>
