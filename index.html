<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goat Conut AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f1a0f; --green: #4ade80; --text: #e2f5e2; }
        body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow: hidden; }
        #setup-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 15px; }
        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #2a3f2a; width: 300px; font-family: 'Space Mono', monospace; }
        button { background: var(--green); font-weight: bold; cursor: pointer; border: none; }
        #cam-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid var(--green); border-radius: 12px; }
        .count { font-size: 3rem; font-family: 'Space Mono'; color: var(--green); display: block; }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>🐐 Goat Conut</h1>
    <input type="password" id="api-key" placeholder="rf_tu_api_key">
    <select id="model-id">
        <option value="brookside-research/goat-looker/1">Goat Looker ⭐</option>
        <option value="justin-burger/goats-hqnax/1">Goats HQ</option>
    </select>
    <button onclick="startApp()">INICIAR</button>
</div>

<div id="cam-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="ui">
        <span class="count" id="counter">0</span>
        <small>CABRAS DETECTADAS</small>
    </div>
</div>

<script>
let video, canvas, ctx, apiKey, model;
let running = false;

async function startApp() {
    apiKey = document.getElementById('api-key').value.trim();
    model = document.getElementById('model-id').value;
    if(!apiKey.startsWith('rf_')) return alert("Key inválida");
    
    document.getElementById('setup-screen').style.display = 'none';
    
    video = document.getElementById('video');
    canvas = document.getElementById('canvas');
    ctx = canvas.getContext('2d');

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        setInterval(detect, 600); // Inferencia cada 600ms
    };
}

async function detect() {
    if(!running) return;

    // Captura
    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = video.videoWidth;
    tempCanvas.height = video.videoHeight;
    tempCanvas.getContext('2d').drawImage(video, 0, 0);
    const base64 = tempCanvas.toDataURL("image/jpeg", 0.6).split(',')[1];

    // URL CORRECTA
    const url = `https://detect.roboflow.com/${model}?api_key=${apiKey}`;

    try {
        const response = await fetch(url, {
            method: "POST",
            body: base64,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
        
        const data = await response.json();
        draw(data.predictions);
    } catch (err) {
        console.error(err);
    }
}

function draw(predictions) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('counter').innerText = predictions.length;

    predictions.forEach(p => {
        const x = p.x - p.width / 2;
        const y = p.y - p.height / 2;

        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, p.width, p.height);

        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText(`Cabra ${Math.round(p.confidence * 100)}%`, x, y > 20 ? y - 10 : y + 25);
    });
}
</script>
</body>
</html>
