<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goat Conut AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* (Se mantiene tu estilo original CSS que está impecable) */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:      #0f1a0f; --surface: #162116; --card:    #1d2e1d;
            --border:  #2a3f2a; --green:   #4ade80; --lime:    #a3e635;
            --amber:   #fbbf24; --red:     #f87171; --text:    #e2f5e2;
            --muted:   #6b8f6b; --mono:    'Space Mono', monospace; --sans:    'Syne', sans-serif;
        }
        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        #setup-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; z-index: 100; }
        .setup-field { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 6px; }
        .setup-field input, .setup-field select { width: 100%; background: var(--card); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-family: var(--mono); font-size: .85rem; padding: 12px 14px; outline: none; }
        #btn-start { width: 100%; max-width: 380px; background: var(--green); color: #0f1a0f; font-weight: 800; border: none; border-radius: 12px; padding: 14px; cursor: pointer; }
        header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
        #status-pill { padding: 5px 11px; border-radius: 999px; font-family: var(--mono); font-size: .6rem; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
        #status-pill.counting { color: var(--green); border-color: var(--green); }
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        #video-wrap { position: relative; background: #000; flex-shrink: 0; }
        #cam { display: block; width: 100%; max-height: 55dvh; object-fit: cover; }
        #overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
        #big-count { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.65); backdrop-filter: blur(8px); border: 1.5px solid var(--green); border-radius: 10px; padding: 6px 14px; text-align: center; }
        #big-count .num { font-size: 2.8rem; font-weight: 800; color: var(--green); font-family: var(--mono); }
        .bump { animation: bumpAnim 0.2s ease; }
        @keyframes bumpAnim { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        #controls { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 14px; display: flex; gap: 10px; }
        #log-section { flex: 1; overflow-y: auto; padding: 10px 14px; }
        #log li { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff; padding: 10px 18px; border-radius: 8px; display: none; z-index: 200; }
    </style>
</head>
<body>

<div id="setup-screen">
    <div style="font-size: 4rem;">🐐</div>
    <h1>Goat Conut AI</h1>
    <div class="setup-field">
        <label style="font-family: var(--mono); font-size: .65rem; color: var(--muted);">Roboflow API Key</label>
        <input type="password" id="api-key-input" placeholder="rf_xxxxxxxxxxxxxxxxxxxxxxxx">
    </div>
    <div class="setup-field">
        <label style="font-family: var(--mono); font-size: .65rem; color: var(--muted);">Modelo</label>
        <select id="model-select">
            <option value="brookside-research/goat-looker/1">Goat Looker ⭐</option>
            <option value="justin-burger/goats-hqnax/1">Goats (Justin)</option>
        </select>
    </div>
    <button id="btn-start" onclick="startApp()">🚀 INICIAR DETECTOR</button>
</div>

<header>
    <div class="logo">
        <div style="background: var(--green); padding: 5px; border-radius: 5px; margin-right: 10px;">🐐</div>
        <div>
            <div style="font-weight: 800;">Goat Conut AI</div>
            <div style="font-size: .6rem; color: var(--muted); font-family: var(--mono);">Roboflow API Edition</div>
        </div>
    </div>
    <div id="status-pill" class="loading">⏳ ESPERANDO</div>
</header>

<main>
    <div id="video-wrap">
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="big-count"><span class="num" id="counter">0</span><br><span style="font-size: .5rem; color: var(--muted); text-transform: uppercase;">cabras</span></div>
    </div>

    <div id="controls">
        <div style="flex: 1;">
            <div style="font-size: .6rem; color: var(--muted);">CONFIANZA: <span id="conf-val">0.40</span></div>
            <input type="range" id="conf-range" min="0.1" max="0.9" step="0.05" value="0.40" style="width: 100%;">
        </div>
        <button id="btn-save" onclick="saveCount()" style="background: var(--green); border: none; border-radius: 8px; padding: 10px; font-weight: 800; cursor: pointer;">💾 GUARDAR</button>
    </div>

    <div
