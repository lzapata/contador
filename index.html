<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goat Detector Pro</title>
    <style>
        body { font-family: sans-serif; background: #0f1a0f; color: #e2f5e2; margin: 0; text-align: center; }
        #setup { padding: 50px 20px; }
        input, select, button { padding: 12px; margin: 10px; border-radius: 8px; width: 80%; max-width: 300px; border: 1px solid #2a3f2a; }
        button { background: #4ade80; color: #000; font-weight: bold; border: none; cursor: pointer; }
        #display { display: none; position: relative; }
        video, canvas { width: 100%; max-height: 70vh; background: #000; }
        #overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
        #log-container { padding: 20px; text-align: left; max-height: 200px; overflow-y: auto; background: #162116; }
        .entry { border-bottom: 1px solid #2a3f2a; padding: 5px; font-size: 0.8rem; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<div id="setup">
    <h2>🐐 Goat Detector AI</h2>
    <input type="password" id="key" placeholder="rf_tu_api_key">
    <select id="model">
        <option value="brookside-research/goat-looker/1">Modelo: Goat Looker</option>
        <option value="justin-burger/goats-hqnax/1">Modelo: Goats HQ</option>
    </select>
    <button onclick="init()">INICIAR</button>
</div>

<div id="display">
    <div style="padding: 10px; background: #162116;">
        <span id="counter" style="font-size: 2rem; color: #4ade80; font-weight: bold;">0</span> CABRAS
        <button onclick="save()" style="width: auto; padding: 5px 15px; margin-left: 20px;">💾 GUARDAR</button>
    </div>
    <video id="v" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="log-container"><strong>HISTORIAL:</strong><div id="logs"></div></div>
</div>

<script>
let video, canvas, ctx, apiKey, modelId;
let currentDetections = [];

async function init() {
    apiKey = document.getElementById('key').value.trim();
    modelId = document.getElementById('model').value;
    if(!apiKey.startsWith('rf_')) return alert("API Key no válida");

    document.getElementById('setup').style.display = 'none';
    document.getElementById('display').style.display = 'block';

    video = document.getElementById('v');
    canvas = document.getElementById('overlay');
    ctx = canvas.getContext('2d');

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        setInterval(predict, 1000); // Una foto por segundo
    };
}

async function predict() {
    const tmp = document.createElement('canvas');
    tmp.width = video.videoWidth; tmp.height = video.videoHeight;
    tmp.getContext('2d').drawImage(video, 0, 0);
    const b64 = tmp.toDataURL("image/jpeg", 0.5).split(',')[1];

    // Usamos el método de paso de parámetros por URL para evitar bloqueos CORS complejos
    const url = `https://detect.roboflow.com/${modelId}?api_key=${apiKey}&name=goat.jpg`;

    try {
        const res = await fetch(url, {
            method: "POST",
            body: b64,
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        });
        const data = await res.json();
        if(data.predictions) {
            currentDetections = data.predictions;
            render();
        }
    } catch(e) { console.error(e); }
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    document.getElementById('counter').innerText = currentDetections.length;

    currentDetections.forEach(p => {
        const x = p.x - p.width/2;
        const y = p.y - p.height/2;
        const conf = Math.round(p.confidence * 100);

        ctx.strokeStyle = "#4ade80";
        ctx.lineWidth = 4;
        ctx.strokeRect(x, y, p.width, p.height);
        
        ctx.fillStyle = "#4ade80";
        ctx.font = "bold 20px Arial";
        ctx.fillText(`GOAT ${conf}%`, x, y - 10);
    });
}

function save() {
    if(currentDetections.length === 0) return;
    const avg = Math.round(currentDetections.reduce((a,b) => a+b.confidence, 0) / currentDetections.length * 100);
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<span>🐐 GOAT (x${currentDetections.length})</span> <span>Efectividad: ${avg}%</span> <span>${new Date().toLocaleTimeString()}</span>`;
    document.getElementById('logs').prepend(div);
}
</script>
</body>
</html>
